<div>
  <h3>Порядок столбцов таблицы Нагрузка</h3>
  <p class="text-muted">Перетаскивайте столбцы для изменения порядка их отображения</p>

  <div class="row mb-3">
    <div class="col-md-12">
      <button class="btn btn-primary" ng-click="saveColumnOrder()">
        <span class="glyphicon glyphicon-save"></span> Сохранить порядок
      </button>
      <button class="btn btn-secondary" ng-click="resetToDefault()">
        <span class="glyphicon glyphicon-refresh"></span> Сбросить по умолчанию
      </button>
    </div>
  </div>

  <div class="panel panel-default">
    <div class="panel-body">
      <ul id="sortable-columns" class="list-group" style="width:auto">
        <li class="list-group-item" ng-repeat="column in columns" ng-model="column">
          <span class="glyphicon glyphicon-move" style="cursor: move; margin-right: 10px;"></span>
          <strong>{{column.label}}</strong>
          <!-- <small class="text-muted pull-right">{{column.name}}</small> -->
        </li>
      </ul>
    </div>
  </div>

  <script>
    $(function() {
      $("#sortable-columns").sortable({
        handle: ".glyphicon-move",
        placeholder: "ui-state-highlight",
        cursor: "move",
        opacity: 0.8,
        axis: "y"
      });
      $("#sortable-columns").disableSelection();
    });
  </script>

  <style>
    .ui-state-highlight {
      height: 2.5em;
      line-height: 2.5em;
      background-color: #f0f0f0;
      border: 1px dashed #999;
    }
    .list-group-item {
      padding: 10px 15px;
    }
    .list-group-item:hover {
      background-color: #f5f5f5;
    }
  </style>
</div>
